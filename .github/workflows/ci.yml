name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check src tests

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -r requirements.txt
      - run: pytest

  package:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip the converter
        run: |
          mkdir -p dist
          zip -r dist/unit-converter.zip src
      - uses: actions/upload-artifact@v4
        with:
          name: unit-converter
          path: dist/unit-converter.zip
          if-no-files-found: error
          retention-days: 14

  deploy:
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: unit-converter
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Unit converter v0.1.${{ github.run_number }}
          body: Packaged source of the unit converter. This release is the delivery step of the CI/CD practice pipeline.
          files: dist/unit-converter.zip
          make_latest: true
          fail_on_unmatched_files: true
